<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F6F4" />
    <meta name="description" content="Ampec Sales Portal" />
    <title>Ampec · Sales Portal</title>
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem('ampec-sales-portal-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) { /* browser storage may be unavailable */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
